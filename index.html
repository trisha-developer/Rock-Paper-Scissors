  <!DOCTYPE html>
  <html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    <main>

      <h1>Rock Paper Scissors</h1>

      <section class="choices">

        <button class="choice" id="rock" aria-label="Rock">
          <i class="fa-regular fa-hand-back-fist"></i>
        </button>

        <button class="choice" id="paper" aria-label="Paper">
          <i class="fa-regular fa-hand"></i>
        </button>

        <button class="choice" id="scissors" aria-label="Scissors">
          <i class="fa-regular fa-hand-scissors fa-rotate-90"></i>
        </button>

      </section>

      <section class="score-board">

        <div class="score">
          <p id="user-score">0</p>
          <p>You</p>
        </div>

        <div class="score">
          <p id="comp-score">0</p>
          <p>Computer</p>
        </div>

      </section>

      <section class="msg-container">
        <p id="msg">Play your move</p>
        <button id="reset-btn">
          <i class="fa-solid fa-rotate-right"></i> Reset Game
        </button>
      </section>

    </main>

    <script src="script.js"> </script>

  </body>

  </html>
